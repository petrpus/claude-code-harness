<!doctype html>
<!--
  docs/maps/index.html — instantiated by `/code-map` from this template.

  Fully self-contained: no CDN, no external requests, works air-gapped. The
  graph data (docs/maps/modules.json) is embedded inline below by `/code-map`
  — replace the placeholder script body, don't append to it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Code Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f8;
        --fg: #1b1b1f;
        --muted: #6b6b76;
        --node-fill: #4f6df5;
        --node-stroke: #2f3e9e;
        --edge: #9aa0ac;
        --panel-bg: #ffffffcc;
        --panel-border: #d8d8de;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14141a;
          --fg: #e7e7ec;
          --muted: #9a9aa6;
          --node-fill: #7c96ff;
          --node-stroke: #b7c4ff;
          --edge: #4a4a58;
          --panel-bg: #1e1e26cc;
          --panel-border: #35353f;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #canvas {
        width: 100%;
        height: 100vh;
        display: block;
        cursor: grab;
      }
      #hint {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 6px 10px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        font-size: 12px;
        color: var(--muted);
        backdrop-filter: blur(4px);
      }
      text.node-label {
        font-size: 11px;
        fill: var(--fg);
        pointer-events: none;
        user-select: none;
      }
      circle.node {
        fill: var(--node-fill);
        stroke: var(--node-stroke);
        stroke-width: 1.5px;
        cursor: grab;
      }
      line.edge {
        stroke: var(--edge);
        stroke-width: 1.2px;
      }
    </style>
  </head>
  <body>
    <div id="hint">drag nodes · wheel to zoom · drag background to pan</div>
    <svg id="canvas"></svg>

    <!-- Placeholder: `/code-map` replaces this element's text content with
         the generated docs/maps/modules.json ({nodes:[...], edges:[...]}). -->
    <script id="graph-data" type="application/json">
      { "nodes": [], "edges": [] }
    </script>

    <script>
      (function () {
        const data = JSON.parse(
          document.getElementById("graph-data").textContent,
        );
        const nodes = data.nodes.map((n) => ({ ...n }));
        const edges = data.edges
          .map((e) => ({
            source: nodes.find((n) => n.id === e.from),
            target: nodes.find((n) => n.id === e.to),
          }))
          .filter((e) => e.source && e.target);

        const svg = document.getElementById("canvas");
        const W = () => window.innerWidth;
        const H = () => window.innerHeight;

        // Radius scales with fan-in (`size`); floor keeps isolated nodes visible.
        const maxSize = Math.max(1, ...nodes.map((n) => n.size || 0));
        const radius = (n) => 8 + 16 * Math.sqrt((n.size || 0) / maxSize);

        // Seed a rough circle layout, then let simple force iterations settle it.
        nodes.forEach((n, i) => {
          const a = (2 * Math.PI * i) / Math.max(1, nodes.length);
          n.x = W() / 2 + Math.cos(a) * 200;
          n.y = H() / 2 + Math.sin(a) * 200;
          n.vx = 0;
          n.vy = 0;
        });

        function tick() {
          // Repulsion between all node pairs.
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
              const a = nodes[i],
                b = nodes[j];
              let dx = a.x - b.x,
                dy = a.y - b.y;
              let dist = Math.max(1, Math.hypot(dx, dy));
              const force = 1800 / (dist * dist);
              dx = (dx / dist) * force;
              dy = (dy / dist) * force;
              a.vx += dx;
              a.vy += dy;
              b.vx -= dx;
              b.vy -= dy;
            }
          }
          // Attraction along edges (spring toward a resting length).
          edges.forEach((e) => {
            const dx = e.target.x - e.source.x;
            const dy = e.target.y - e.source.y;
            const dist = Math.max(1, Math.hypot(dx, dy));
            const force = (dist - 140) * 0.01;
            const fx = (dx / dist) * force;
            const fy = (dy / dist) * force;
            e.source.vx += fx;
            e.source.vy += fy;
            e.target.vx -= fx;
            e.target.vy -= fy;
          });
          // Pull everything gently toward center so the graph doesn't drift off-screen.
          nodes.forEach((n) => {
            n.vx += (W() / 2 - n.x) * 0.001;
            n.vy += (H() / 2 - n.y) * 0.001;
          });
          // Integrate with damping.
          nodes.forEach((n) => {
            if (n.fixed) return;
            n.vx *= 0.85;
            n.vy *= 0.85;
            n.x += n.vx;
            n.y += n.vy;
          });
        }

        // --- SVG scaffolding: arrowhead marker, edge lines, node circles + labels ---
        const NS = "http://www.w3.org/2000/svg";
        function el(tag, attrs) {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs) e.setAttribute(k, attrs[k]);
          return e;
        }

        const viewport = el("g", { id: "viewport" });
        svg.appendChild(
          (() => {
            const defs = el("defs");
            const marker = el("marker", {
              id: "arrow",
              viewBox: "0 0 10 10",
              refX: "9",
              refY: "5",
              markerWidth: "6",
              markerHeight: "6",
              orient: "auto-start-reverse",
            });
            marker.appendChild(
              el("path", { d: "M0,0 L10,5 L0,10 z", fill: "var(--edge)" }),
            );
            defs.appendChild(marker);
            return defs;
          })(),
        );
        svg.appendChild(viewport);

        const edgeEls = edges.map((e) => {
          const line = el("line", {
            class: "edge",
            "marker-end": "url(#arrow)",
          });
          viewport.appendChild(line);
          return line;
        });

        const nodeEls = nodes.map((n) => {
          const g = el("g");
          const c = el("circle", { class: "node", r: radius(n) });
          const label = el("text", {
            class: "node-label",
            x: radius(n) + 4,
            y: 4,
          });
          label.textContent = n.label || n.id;
          g.appendChild(c);
          g.appendChild(label);
          viewport.appendChild(g);
          makeDraggable(g, n);
          return g;
        });

        function render() {
          edgeEls.forEach((line, i) => {
            const e = edges[i];
            line.setAttribute("x1", e.source.x);
            line.setAttribute("y1", e.source.y);
            line.setAttribute("x2", e.target.x);
            line.setAttribute("y2", e.target.y);
          });
          nodeEls.forEach((g, i) => {
            g.setAttribute(
              "transform",
              `translate(${nodes[i].x},${nodes[i].y})`,
            );
          });
        }

        let running = true;
        function loop() {
          if (!running) return;
          tick();
          render();
          requestAnimationFrame(loop);
        }
        loop();
        // Settle into a static layout after a while to save CPU.
        setTimeout(() => {
          running = false;
        }, 4000);

        // --- Drag a single node ---
        function makeDraggable(g, n) {
          let dragging = false;
          g.addEventListener("pointerdown", (ev) => {
            dragging = true;
            n.fixed = true;
            running = true;
            loop();
            g.setPointerCapture(ev.pointerId);
            ev.stopPropagation();
          });
          g.addEventListener("pointermove", (ev) => {
            if (!dragging) return;
            const pt = toViewport(ev.clientX, ev.clientY);
            n.x = pt.x;
            n.y = pt.y;
            n.vx = 0;
            n.vy = 0;
          });
          g.addEventListener("pointerup", () => {
            dragging = false;
          });
        }

        // --- Pan (drag background) + zoom (wheel) ---
        let pan = { x: 0, y: 0 },
          zoom = 1;
        let panning = false,
          panStart = null;

        function applyTransform() {
          viewport.setAttribute(
            "transform",
            `translate(${pan.x},${pan.y}) scale(${zoom})`,
          );
        }
        function toViewport(clientX, clientY) {
          const rect = svg.getBoundingClientRect();
          return {
            x: (clientX - rect.left - pan.x) / zoom,
            y: (clientY - rect.top - pan.y) / zoom,
          };
        }

        svg.addEventListener("pointerdown", (ev) => {
          panning = true;
          panStart = { x: ev.clientX - pan.x, y: ev.clientY - pan.y };
        });
        svg.addEventListener("pointermove", (ev) => {
          if (!panning) return;
          pan.x = ev.clientX - panStart.x;
          pan.y = ev.clientY - panStart.y;
          applyTransform();
        });
        window.addEventListener("pointerup", () => {
          panning = false;
        });
        svg.addEventListener(
          "wheel",
          (ev) => {
            ev.preventDefault();
            zoom = Math.min(4, Math.max(0.2, zoom * (ev.deltaY < 0 ? 1.1 : 0.9)));
            applyTransform();
          },
          { passive: false },
        );

        window.addEventListener("resize", render);
      })();
    </script>
  </body>
</html>
