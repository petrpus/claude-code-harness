name: Deploy guide to GitHub Pages

# Publishes docs/ (the self-contained guide + index redirect) to GitHub Pages.
# `configure-pages` with enablement:true turns Pages on automatically on first
# run for a public repo, so no manual Settings toggle is needed. If the token
# isn't permitted to enable Pages, the run fails with a clear message and you can
# enable it once under Settings → Pages (source: GitHub Actions), then re-run.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload docs/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
